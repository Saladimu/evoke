<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVOKE 2 - Kalender Lomba</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script>
        (function () {
            try {
                if (localStorage.getItem("evoke-theme") === "dark") {
                    document.documentElement.classList.add("dark");
                }
            } catch (e) {}
        })();
    </script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; font-family: sans-serif; }
        .nav-bar { background: #333; padding: 10px 20px; display: flex; gap: 20px; }
        .nav-bar a { color: white; text-decoration: none; font-weight: bold; font-size: 18px; }
        .nav-bar a:hover { color: #007bff; }
        iframe { width: 100%; flex-grow: 1; border: none; }
        .theme-toggle {
            margin-left: auto; background: none; border: none; cursor: pointer;
            color: #fff; padding: 2px; display: flex; align-items: center; border-radius: 6px;
        }
        .theme-toggle:hover { background: rgba(255,255,255,.12); }
        .theme-toggle svg { width: 20px; height: 20px; display: block; }
        .theme-toggle .icon-sun { display: none; }
        .dark .theme-toggle .icon-sun { display: block; }
        .dark .theme-toggle .icon-moon { display: none; }
        .dark { color-scheme: dark; }
        .dark body { background: #121417; }
        .dark .nav-bar { background: #1b2024; }
    </style>
</head>
<body>
    <!-- Top Menu Bar -->
    <div class="nav-bar" id="navBar">
        <a href="index.html">📊 Hasil Lomba</a>
        <a href="events.html" style="color: #007bff;" data-secret>🗓 Kalender Lomba</a> <!-- Highlighted active tab -->
        <a href="feedback.html" data-secret>📩 Feedback </a>
        <button id="themeToggle" class="theme-toggle" aria-label="Ganti tema" aria-pressed="false">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>

    <!-- The iframe starts empty to prevent history corruption -->
    <iframe id="appsheet-frame"></iframe>

     <script>
        // 1. Force the iframe to load cleanly without storing memory in Android's back stack
        window.onload = function() {
            const iframe = document.getElementById('appsheet-frame');
            const appsheetUrl = "https://www.appsheet.com/start/6ebd3094-b4f7-45cc-ba70-698e89d4df68?platform=desktop#appName=CalendarEvoke-110568804&vss=H4sIAAAAAAAAA62PvQrCMBRGX0W-uU-QVRxUdLG4GIfY3EowTaRJrSXk3b31B3EtjjmXc_iScDPU76KqLhCH9H2taYBAkiiHK0kIibl3sfVWopDYquYFV0r3ys5K5bRxZ4mMfCw-lUgBIk2JiH8sKWA0uWhqQ-1YHH0uvW0-jy6DXxO5QNNFdbL0_AKbOTOrfdUF0nueNXlOWLrF_cpo4zWHa2UD5QdQ5Nd9gwEAAA==&view=Jadwal%20Tanding"; 
            if (iframe) {
                iframe.contentWindow.location.replace(appsheetUrl);
            }
        };

        // 2. Median.co JS Bridge: Intercept Android physical back button and gesture
        document.addEventListener("DOMContentLoaded", function() {
            window.median = window.median || {};
            window.median.android = window.median.android || {};
            
            // Tells Median to run this custom Javascript instead of breaking the app view
            window.onAndroidBackKey = function() {
                window.location.href = "index.html";
                return true; // Prevents the default webview 'No Internet' crash
            };
        });
        
        // 3. Browser fallback for web testing
        window.history.pushState(null, "", window.location.href);
        window.addEventListener('popstate', function () {
            window.location.href = "index.html";
        });

        // 4. Hidden menu toggle: 5 clicks in the menu bar toggles Kalender Lomba / Feedback
        (function () {
            var bar = document.getElementById("navBar");
            if (!bar) return;
            var secretLinks = bar.querySelectorAll("[data-secret]");
            var KEY = "evoke-extra-menu";
            var clicks = 0;
            var timer = null;
            function apply() {
                var on = localStorage.getItem(KEY) === "1";
                secretLinks.forEach(function (a) { a.style.display = on ? "" : "none"; });
            }
            bar.addEventListener("click", function () {
                clicks++;
                clearTimeout(timer);
                timer = setTimeout(function () { clicks = 0; }, 3000);
                if (clicks >= 5) {
                    clicks = 0;
                    localStorage.setItem(KEY, localStorage.getItem(KEY) === "1" ? "0" : "1");
                    apply();
                }
            });
            apply();
        })();

        (function () {
            var btn = document.getElementById("themeToggle");
            if (!btn) return;
            var dark = document.documentElement.classList.contains("dark");
            btn.setAttribute("aria-pressed", dark ? "true" : "false");
            btn.addEventListener("click", function () {
                dark = !dark;
                document.documentElement.classList.toggle("dark", dark);
                try { localStorage.setItem("evoke-theme", dark ? "dark" : "light"); } catch (e) {}
                btn.setAttribute("aria-pressed", dark ? "true" : "false");
            });
        })();
    </script>

</body>
</html>
